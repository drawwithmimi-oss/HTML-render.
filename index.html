<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Viewer">
<meta name="theme-color" content="#0e1014">
<title>Viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230e1014'/%3E%3C/svg%3E">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; background: #0e1014; color: #e8e3d4; font-family: -apple-system, system-ui, sans-serif; overflow-x: hidden; }
.shell { min-height: 100%; padding: max(28px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom)); max-width: 440px; margin: 0 auto; }
.btn {
  display: flex; align-items: center; justify-content: center;
  width: 100%; padding: 14px; background: transparent; border: 1px solid #2a2c32;
  color: #e8e3d4; font-family: ui-monospace, monospace; font-size: 12px;
  font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
  cursor: pointer; -webkit-appearance: none; text-decoration: none;
}
.btn:active { opacity: 0.7; }
.btn.primary { background: #d65442; border-color: #d65442; color: #fff; }
input[type="file"] { display: none; }

.list { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
.row {
  display: flex; align-items: center; gap: 10px;
  background: #1a1c22; border: 1px solid #2a2c32;
  padding: 12px 14px; cursor: pointer;
}
.row:active { background: #22252d; }
.row-main { flex: 1; min-width: 0; }
.row-name {
  font-family: ui-monospace, monospace; font-size: 13px;
  color: #e8e3d4; word-break: break-all; line-height: 1.3;
}
.row-size {
  font-family: ui-monospace, monospace; font-size: 10px;
  color: #5e5a52; margin-top: 2px; letter-spacing: 0.04em;
}
.row-actions { display: flex; gap: 4px; flex-shrink: 0; }
.icon-btn {
  background: transparent; border: 0; color: #5e5a52;
  width: 32px; height: 32px; cursor: pointer;
  font-family: ui-monospace, monospace; font-size: 15px;
  display: grid; place-items: center; padding: 0;
}
.icon-btn.star.on { color: #d9a44b; }
.icon-btn.del { color: #5e5a52; font-size: 18px; line-height: 1; }
.icon-btn:active { opacity: 0.5; }

.empty {
  text-align: center; padding: 24px 12px; color: #5e5a52;
  font-family: ui-monospace, monospace; font-size: 11px;
  letter-spacing: 0.08em; margin-top: 10px;
}

#app-frame { display: none; position: fixed; left: 0; right: 0; top: calc(32px + env(safe-area-inset-top)); bottom: 0; width: 100%; height: calc(100% - 32px - env(safe-area-inset-top)); border: 0; background: #0e1014; z-index: 1; }
body.app-mode .shell { display: none; }
body.app-mode #app-frame { display: block; }

.exit-bar { display: none; position: fixed; top: 0; left: 0; right: 0; height: calc(32px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top); background: #000; border-bottom: 1px solid #2a2c32; z-index: 1000; align-items: center; padding-left: 12px; padding-right: 12px; }
body.app-mode .exit-bar { display: flex; }
.exit-btn { background: transparent; border: 0; color: #d65442; font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; padding: 6px 10px; display: flex; align-items: center; gap: 6px; }
.exit-btn:active { opacity: 0.6; }
.exit-name { color: #5e5a52; font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.04em; margin-left: auto; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #e8e3d4; color: #0e1014; padding: 10px 16px; font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; z-index: 1500; opacity: 0; pointer-events: none; transition: all 0.2s ease; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="shell">
  <label for="file-input" class="btn primary">Pick file</label>
  <input type="file" id="file-input" accept=".html,.htm,text/html">
  <div class="list" id="list"></div>
</div>

<div class="exit-bar">
  <button class="exit-btn" id="exit-btn">&larr; Back</button>
  <span class="exit-name" id="exit-name"></span>
</div>
<iframe id="app-frame"></iframe>
<div class="toast" id="toast"></div>

<script>
(function() {
  // Keys: v-list = JSON array of {id, name, size, star, body-key}
  //       v-b-<id> = HTML content for app id
  //       v-crash = crash counter for auto-open
  const K_LIST = 'v-list', K_CRASH = 'v-crash';
  const PFX_BODY = 'v-b-';

  const fi = document.getElementById('file-input');
  const listEl = document.getElementById('list');
  const frame = document.getElementById('app-frame');
  const exitBtn = document.getElementById('exit-btn');
  const exitName = document.getElementById('exit-name');
  const toast = document.getElementById('toast');

  let mem = {};
  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}}
  function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){mem[k]=v;return false}}
  function lsDel(k){try{localStorage.removeItem(k)}catch(e){}delete mem[k]}

  let tt;
  function flash(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('show')},1600)}

  function getList() {
    try { const v = lsGet(K_LIST); if (!v) return []; const a = JSON.parse(v); return Array.isArray(a) ? a : []; } catch(e){ return []; }
  }
  function saveList(l){ lsSet(K_LIST, JSON.stringify(l)); }

  function formatSize(n){
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
    return (n/1048576).toFixed(1) + ' MB';
  }

  function render() {
    const list = getList();
    listEl.innerHTML = '';
    if (!list.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'No files';
      listEl.appendChild(e);
      return;
    }
    list.forEach(function(item){
      const row = document.createElement('div');
      row.className = 'row';
      const main = document.createElement('div');
      main.className = 'row-main';
      const name = document.createElement('div');
      name.className = 'row-name';
      name.textContent = item.name || 'Untitled';
      main.appendChild(name);
      const sz = document.createElement('div');
      sz.className = 'row-size';
      sz.textContent = formatSize(item.size || 0);
      main.appendChild(sz);
      row.appendChild(main);

      const actions = document.createElement('div');
      actions.className = 'row-actions';

      const star = document.createElement('button');
      star.className = 'icon-btn star' + (item.star ? ' on' : '');
      star.textContent = item.star ? '★' : '☆';
      star.title = 'Auto-open';
      star.addEventListener('click', function(e){
        e.stopPropagation();
        // Only one star at a time
        const l = getList().map(function(x){ return Object.assign({}, x, { star: x.id === item.id ? !item.star : false }); });
        saveList(l); render();
      });
      actions.appendChild(star);

      const del = document.createElement('button');
      del.className = 'icon-btn del';
      del.textContent = '×';
      del.title = 'Remove';
      del.addEventListener('click', function(e){
        e.stopPropagation();
        let ok = false; try { ok = confirm('Remove?'); } catch(err){ ok = true; }
        if (!ok) return;
        lsDel(PFX_BODY + item.id);
        saveList(getList().filter(function(x){ return x.id !== item.id; }));
        render();
      });
      actions.appendChild(del);

      row.appendChild(actions);
      row.addEventListener('click', function(){ runItem(item); });
      listEl.appendChild(row);
    });
  }

  fi.addEventListener('change', function(e){
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = function(ev){
      const body = String(ev.target.result || '');
      if (!body) { flash('Empty'); return; }
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      const ok = lsSet(PFX_BODY + id, body);
      const list = getList();
      // Dedupe by name — if same name exists, update it instead of adding
      const existingIdx = list.findIndex(function(x){ return x.name === f.name; });
      const entry = { id: existingIdx >= 0 ? list[existingIdx].id : id, name: f.name, size: body.length, star: existingIdx >= 0 ? list[existingIdx].star : false };
      if (existingIdx >= 0) {
        lsDel(PFX_BODY + list[existingIdx].id);
        lsSet(PFX_BODY + entry.id, body);
        list[existingIdx] = entry;
      } else {
        list.push(entry);
      }
      saveList(list); render();
      flash(ok ? 'Added' : 'Added (session)');
    };
    r.readAsText(f); fi.value = '';
  });

  function runItem(item) {
    const body = lsGet(PFX_BODY + item.id);
    if (!body) { flash('Missing'); return; }
    try {
      if (frame._u) URL.revokeObjectURL(frame._u);
      const b = new Blob([body], { type: 'text/html;charset=utf-8' });
      const u = URL.createObjectURL(b);
      frame._u = u; frame.src = u;
      exitName.textContent = item.name || '';
      document.body.classList.add('app-mode');
    } catch(e){ flash('Error'); }
  }
  function exit() {
    document.body.classList.remove('app-mode');
    setTimeout(function(){
      if (frame._u) { try { URL.revokeObjectURL(frame._u) } catch(e){} frame._u = null; }
      frame.src = 'about:blank';
      exitName.textContent = '';
    }, 100);
  }
  exitBtn.addEventListener('click', exit);

  // URL recovery
  const u = new URL(location.href), p = u.searchParams;
  if (p.has('reset')) {
    getList().forEach(function(x){ lsDel(PFX_BODY + x.id); });
    lsDel(K_LIST); lsDel(K_CRASH);
    try { history.replaceState({}, '', u.pathname); } catch(e){}
    flash('Reset');
  }
  const safe = p.has('safe');
  if (safe) { try { history.replaceState({}, '', u.pathname); } catch(e){} }

  const cc = parseInt(lsGet(K_CRASH) || '0', 10);
  const locked = cc >= 2;
  if (locked) {
    // Clear all stars so auto-open doesn't re-crash
    saveList(getList().map(function(x){ return Object.assign({}, x, { star: false }); }));
    lsDel(K_CRASH);
  }

  render();

  // Auto-open starred item
  if (!safe && !locked) {
    const starred = getList().find(function(x){ return x.star; });
    if (starred) {
      lsSet(K_CRASH, String(cc + 1));
      setTimeout(function(){
        runItem(starred);
        frame.addEventListener('load', function once(){
          frame.removeEventListener('load', once);
          setTimeout(function(){ lsDel(K_CRASH); }, 1500);
        }, { once: true });
      }, 400);
    }
  }
})();
</script>

</body>
</html>
